<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora — Frontend Lab</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calc" aria-label="Calculadora">
    <h1 class="calc__title">🧮 Calculadora</h1>

    <div class="calc__display" id="display" role="status" aria-live="polite">0</div>

    <div class="calc__grid">
      <button class="calc__btn calc__btn--fn" data-action="clear">C</button>
      <button class="calc__btn calc__btn--fn" data-action="backspace">⌫</button>
      <button class="calc__btn calc__btn--fn" data-action="percent">%</button>
      <button class="calc__btn calc__btn--op" data-op="/">÷</button>

      <button class="calc__btn" data-num="7">7</button>
      <button class="calc__btn" data-num="8">8</button>
      <button class="calc__btn" data-num="9">9</button>
      <button class="calc__btn calc__btn--op" data-op="*">×</button>

      <button class="calc__btn" data-num="4">4</button>
      <button class="calc__btn" data-num="5">5</button>
      <button class="calc__btn" data-num="6">6</button>
      <button class="calc__btn calc__btn--op" data-op="-">−</button>

      <button class="calc__btn" data-num="1">1</button>
      <button class="calc__btn" data-num="2">2</button>
      <button class="calc__btn" data-num="3">3</button>
      <button class="calc__btn calc__btn--op" data-op="+">+</button>

      <button class="calc__btn calc__btn--zero" data-num="0">0</button>
      <button class="calc__btn" data-action="dot">.</button>
      <button class="calc__btn calc__btn--equals" data-action="equals">=</button>
    </div>

    <p class="calc__hint" id="hint">Digite no teclado ou clique nos botões</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
